services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: partyplanner-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-PartyPlanner!2026}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
